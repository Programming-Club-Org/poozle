name: Clang Format & Meson Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - dev 
  workflow_dispatch:

jobs:
  clang-format-checking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install clang-format-16 and colordiff
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-16 colordiff

      - name: Check formatting
        run: |
          files=$(find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \))

          if [ -z "$files" ]; then
            echo "No C/C++ files found."
            exit 0
          fi

          failed=0
          for f in $files; do
            diff_output=$(diff -u "$f" <(clang-format-16 -style=file "$f") || true)
            if [ -n "$diff_output" ]; then
              echo "❌ File $f is not properly formatted:"
              echo "$diff_output" | colordiff | cat
              failed=1
            fi
          done

          if [ $failed -eq 1 ]; then
            echo "Some files are not properly formatted. Run clang-format-16 locally to fix."
            exit 1
          fi

  meson-build-check:
    runs-on: ubuntu-latest
    needs: clang-format-checking
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson g++ cmake pkg-config

      - name: Configure Meson build
        run: |
          meson setup builddir --buildtype=debug -Dcpp_std=c++17

      - name: Compile project
        run: |
          meson compile -C builddir
